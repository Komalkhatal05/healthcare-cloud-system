{% extends "base.html" %}
{% block title %}Login | HealthCare Plus{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="role-icon mb-3">🔐</div>
      <h1 class="h3 fw-bold">Welcome back</h1>
      <p class="text-secondary">Login with your registered email and password.</p>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3"><label class="form-label">Email address</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="username"></div>
        <div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary btn-lg w-100">Login securely</button>
      </form>
      <p class="mt-4 mb-0 text-secondary">New patient? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
